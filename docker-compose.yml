services:
  backend:
    build: ./backend
    environment:
      - Kintsugi-Code_ENVIRONMENT=production
      - Kintsugi-Code_LLM_PROVIDER=mock
      - Kintsugi-Code_LLM_BASE_URL=https://api.openai.com/v1
      - Kintsugi-Code_LLM_MODEL=gpt-4o-mini
    volumes:
      - Kintsugi-Code-data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  Kintsugi-Code-data:

