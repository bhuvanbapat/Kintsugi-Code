services:
  backend:
    build: ./backend
    environment:
      - CODEFORGE_ENVIRONMENT=production
      - CODEFORGE_LLM_PROVIDER=mock
      - CODEFORGE_LLM_BASE_URL=https://api.openai.com/v1
      - CODEFORGE_LLM_MODEL=gpt-4o-mini
    volumes:
      - codeforge-data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  codeforge-data:
